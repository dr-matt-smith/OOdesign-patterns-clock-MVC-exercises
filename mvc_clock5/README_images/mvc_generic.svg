<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3557" />
    </marker>
  </defs>
  <rect width="780" height="420" fill="#ffffff" />

  <!-- User -->
  <rect x="20" y="170" width="120" height="70" rx="35" fill="#f1faee" stroke="#5b6472" stroke-width="1.5" />
  <text x="80" y="211" text-anchor="middle" font-weight="bold" fill="#1b1f2a">User</text>

  <!-- Controller -->
  <rect x="270" y="30" width="220" height="90" rx="8" fill="#fde2c0" stroke="#b5651d" stroke-width="2" />
  <text x="380" y="62" text-anchor="middle" font-weight="bold" font-size="16" fill="#1b1f2a">Controller</text>
  <text x="380" y="84" text-anchor="middle" fill="#1b1f2a">handles the input</text>
  <text x="380" y="103" text-anchor="middle" fill="#5b6472" font-size="12">(button clicks, key presses ...)</text>

  <!-- Model -->
  <rect x="550" y="160" width="210" height="90" rx="8" fill="#cde8f6" stroke="#457b9d" stroke-width="2" />
  <text x="655" y="192" text-anchor="middle" font-weight="bold" font-size="16" fill="#1b1f2a">Model</text>
  <text x="655" y="214" text-anchor="middle" fill="#1b1f2a">the data, and its rules</text>
  <text x="655" y="233" text-anchor="middle" fill="#5b6472" font-size="12">(knows nothing about the page)</text>

  <!-- View -->
  <rect x="270" y="300" width="220" height="90" rx="8" fill="#d4f1e4" stroke="#2a9d8f" stroke-width="2" />
  <text x="380" y="332" text-anchor="middle" font-weight="bold" font-size="16" fill="#1b1f2a">View</text>
  <text x="380" y="354" text-anchor="middle" fill="#1b1f2a">shows the data</text>
  <text x="380" y="373" text-anchor="middle" fill="#5b6472" font-size="12">(there can be many views)</text>

  <!-- User -> Controller -->
  <line x1="120" y1="178" x2="268" y2="92" stroke="#1d3557" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="128" y="125" fill="#1b1f2a">1. input</text>

  <!-- Controller -> Model -->
  <line x1="490" y1="90" x2="590" y2="158" stroke="#1d3557" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="552" y="105" fill="#1b1f2a">2. changes the data</text>

  <!-- Model -> View (notify) -->
  <line x1="565" y1="252" x2="492" y2="318" stroke="#1d3557" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)" />
  <text x="545" y="300" fill="#1b1f2a">3. notifies</text>
  <text x="545" y="317" fill="#5b6472" font-size="12">(Observer: update())</text>

  <!-- View -> Model (reads) -->
  <line x1="492" y1="370" x2="640" y2="252" stroke="#1d3557" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="600" y="355" fill="#1b1f2a">4. reads the data</text>
  <text x="600" y="372" fill="#5b6472" font-size="12">(getters)</text>

  <!-- View -> User -->
  <line x1="268" y1="330" x2="120" y2="234" stroke="#1d3557" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="105" y="300" fill="#1b1f2a">5. output</text>
</svg>
